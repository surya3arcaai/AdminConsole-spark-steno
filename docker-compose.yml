version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: arca_spark_db
    environment:
      POSTGRES_USER: arca_admin
      POSTGRES_PASSWORD: arca_secret_2026
      POSTGRES_DB: arca_spark_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arca_admin -d arca_spark_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rbac-service:
    build:
      context: .
      dockerfile: rbac-service/Dockerfile
    container_name: rbac_service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:Password%40123@192.168.112.6:31155/arca-spark
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - JWT_ALGORITHM=HS256
      - SERVICE_PORT=8001
    volumes:
      - ./shared:/app/shared:ro

  user-onboarding-service:
    build:
      context: .
      dockerfile: user-onboarding-service/Dockerfile
    container_name: user_onboarding_service
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:Password%40123@192.168.112.6:31155/arca-spark
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - JWT_ALGORITHM=HS256
      - SERVICE_PORT=8005
      - KEYCLOAK_SERVER_URL=http://192.168.112.6:31636
      - KEYCLOAK_REALM=arca-spark
      - KEYCLOAK_CLIENT_ID=arca-spark
      - KEYCLOAK_CLIENT_SECRET=ihdp5bhmgBsd1kWEYeyJxHeDrf7ln5ji
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=Password@123
    volumes:
      - ./shared:/app/shared:ro

  template-service:
    build:
      context: .
      dockerfile: template-service/Dockerfile
    container_name: template_service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:Password%40123@192.168.112.6:31155/arca-spark
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - JWT_ALGORITHM=HS256
      - SERVICE_PORT=8003
    volumes:
      - ./shared:/app/shared:ro

  logs-service:
    build:
      context: .
      dockerfile: logs-service/Dockerfile
    container_name: logs_service
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:Password%40123@192.168.112.6:31155/arca-spark
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - JWT_ALGORITHM=HS256
      - SERVICE_PORT=8004
    volumes:
      - ./shared:/app/shared:ro

  loki:
    image: grafana/loki:latest
    container_name: arca_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./grafana/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: arca_promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./grafana/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    restart: unless-stopped
    depends_on:
      - loki

  grafana:
    image: grafana/grafana-oss:latest
    container_name: arca_grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SECURE=false
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - postgres
      - loki

volumes:
  postgres_data:
  grafana_data:
  loki_data:

networks:
  default:
    name: arca_spark_network

